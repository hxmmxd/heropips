  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

00: #2C3445;\n  --ink-500: #3E4759;\n\n  /* Paper — light surfaces (warm lime-tinted whites, for social/light mode) */\n  --paper-0: #FFFFFF;\n  --paper-50: #F5F6F1;\n  --paper-100: #ECEEE4;\n  --paper-200: #DFE2D2;\n  --ink-on-paper: #14171A;\n\n  /* Text on ink */\n  --text-hi: #F3F5FA;\n  --text-mid: #9BA4B8;\n  --text-low: #626B80;\n\n  /* Volt — primary accent (oklch ≈ 0.93 0.23 122) */\n  --volt-300: #E2FF85;\n  --volt-400: #D3FF57;\n  --volt-500: #C6FF2E;\n  --volt-600: #A9E514;\n  --volt-700: #86BC05;\n  --on-volt: #0D0F07;\n\n  /* Pulse — secondary accent, AI/intelligence (oklch ≈ 0.62 0.21 290) */\n  --pulse-300: #C9BBFF;\n  --pulse-400: #A98FFF;\n  --pulse-500: #8E66FF;\n  --pulse-600: #7347F0;\n  --on-pulse: #0F0A1E;\n\n  /* Semantic — trading */\n  --profit-400: #47FFAE;\n  --profit-500: #21E88D;\n  --profit-600: #0FC471;\n  --loss-400: #FF6584;\n  --loss-500: #FF3D63;\n  --loss-600: #E02348;\n  --warn-400: #FFC24B;\n  --info-400: #45D8FF;\n\n  /* Tints (for badges/fills on ink) */\n  --volt-tint: rgba(198, 255, 46, 0.12);\n  --pulse-tint: rgba(142, 102, 255, 0.14);\n  --profit-tint: rgba(33, 232, 141, 0.12);\n  --loss-tint: rgba(255, 61, 99, 0.12);\n  --warn-tint: rgba(255, 194, 75, 0.12);\n  --info-tint: rgba(69, 216, 255, 0.12);\n\n  /* Borders on ink */\n  --border-1: rgba(243, 245, 250, 0.08);\n  --border-2: rgba(243, 245, 250, 0.14);\n  --border-3: rgba(243, 245, 250, 0.24);\n\n  /* Semantic aliases */\n  --bg-app: var(--ink-950);\n  --surface-1: var(--ink-900);\n  --surface-2: var(--ink-850);\n  --surface-3: var(--ink-800);\n  --surface-raised: var(--ink-700);\n  --accent: var(--volt-500);\n  --accent-hover: var(--volt-400);\n  --text-body: var(--text-mid);\n  --text-heading: var(--text-hi);\n  --link: var(--volt-400);\n  --link-hover: var(--volt-300);\n  --accent-text: var(--volt-400);\n}\n\n/* Light mode — set data-theme=\"light\" on <html>. Volt/pulse fills stay identical;\n   accent TEXT tones darken for contrast on paper. */\n[data-theme=\"light\"] {\n  --bg-app: var(--paper-50);\n  --surface-1: var(--paper-0);\n  --surface-2: #FAFBF6;\n  --surface-3: var(--paper-100);\n  --surface-raised: var(--paper-200);\n  --text-hi: #14171A;\n  --text-mid: #49525F;\n  --text-low: #87909F;\n  --border-1: rgba(20, 23, 26, 0.08);\n  --border-2: rgba(20, 23, 26, 0.14);\n  --border-3: rgba(20, 23, 26, 0.24);\n  --volt-400: #86BC05;\n  --pulse-300: #6740E8;\n  --profit-400: #0C9E5C;\n  --loss-400: #D92148;\n  --warn-400: #A8760A;\n  --info-400: #0A87B8;\n  --volt-tint: rgba(134, 188, 5, 0.14);\n  --pulse-tint: rgba(115, 71, 240, 0.10);\n  --profit-tint: rgba(15, 196, 113, 0.13);\n  --loss-tint: rgba(224, 35, 72, 0.10);\n  --warn-tint: rgba(200, 140, 10, 0.14);\n  --info-tint: rgba(10, 164, 220, 0.12);\n  --link: #6E9B04;\n  --link-hover: #86BC05;\n  --accent-text: #6E9B04;\n}\n\n/* HeroPips type system\n   Display: Space Grotesk — geometric, techy, the brand voice. Tight tracking.\n   Body/UI: Instrument Sans — clean, contemporary, highly legible.\n   Mono: JetBrains Mono — every number that matters (prices, pips, P&L) is mono. */\n:root {\n  --font-display: 'Space Grotesk', 'Helvetica Neue', sans-serif;\n  --font-body: 'Instrument Sans', 'Helvetica Neue', sans-serif;\n  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;\n\n  /* Scale (~1.25 ratio) */\n  --text-2xs: 11px;\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-md: 15px;\n  --text-lg: 17px;\n  --text-xl: 20px;\n  --text-2xl: 25px;\n  --text-3xl: 31px;\n  --text-4xl: 39px;\n  --text-5xl: 49px;\n  --text-6xl: 61px;\n  --text-7xl: 80px;\n\n  /* Tracking */\n  --track-display: -0.03em;   /* headlines */\n  --track-tight: -0.01em;     /* subheads, buttons */\n  --track-caps: 0.14em;       /* uppercase eyebrows/labels */\n\n  /* Leading */\n  --leading-display: 1.02;\n  --leading-heading: 1.12;\n  --leading-body: 1.55;\n  --leading-tight: 1.3;\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n}\n\n/* HeroPips spacing & radius — 4px base grid; chunky gen-z corners */\n:root {\n  --sp-1: 4px;\n  --sp-2: 8px;\n  --sp-3: 12px;\n  --sp-4: 16px;\n  --sp-5: 20px;\n  --sp-6: 24px;\n  --sp-8: 32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n\n  /* Radius — cards are soft (20), controls are softer (14), primary actions are pills */\n  --r-xs: 6px;\n  --r-sm: 10px;\n  --r-md: 14px;\n  --r-lg: 20px;\n  --r-xl: 28px;\n  --r-2xl: 36px;\n  --r-full: 999px;\n\n  /* Control heights */\n  --ctl-sm: 36px;\n  --ctl-md: 44px;\n  --ctl-lg: 52px;\n}\n\n/* HeroPips effects — glows are the brand's shadow language on ink */\n:root {\n  --ring-volt: 0 0 0 3px rgba(198, 255, 46, 0.22);\n  --ring-loss: 0 0 0 3px rgba(255, 61, 99, 0.22);\n  --glow-volt: 0 0 32px -4px rgba(198, 255, 46, 0.4);\n  --glow-volt-lg: 0 0 64px -8px rgba(198, 255, 46, 0.45);\n  --glow-pulse: 0 0 32px -4px rgba(142, 102, 255, 0.4);\n  --glow-profit: 0 0 28px -6px rgba(33, 232, 141, 0.45);\n\n  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.5);\n  --shadow-card: 0 16px 48px -16px rgba(0, 0, 0, 0.6);\n\n  /* Gradients — use sparingly: hero backdrops + share cards only */\n  --grad-volt: linear-gradient(115deg, #D3FF57 0%, #C6FF2E 55%, #8AE85C 100%);\n  --grad-hero: radial-gradient(900px 480px at 12% -10%, rgba(142, 102, 255, 0.16), transparent 60%),\n               radial-gradient(1100px 560px at 88% -20%, rgba(198, 255, 46, 0.12), transparent 60%);\n  --grad-fade-ink: linear-gradient(180deg, rgba(7, 8, 12, 0) 0%, #07080C 100%);\n\n  /* Motion */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);\n  --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);\n  --dur-fast: 120ms;\n  --dur-med: 220ms;\n}\n\n[data-theme=\"light\"] {\n  --ring-volt: 0 0 0 3px rgba(134, 188, 5, 0.28);\n  --glow-volt: 0 8px 28px -6px rgba(134, 188, 5, 0.45);\n  --glow-volt-lg: 0 16px 56px -8px rgba(134, 188, 5, 0.5);\n  --glow-pulse: 0 8px 28px -6px rgba(115, 71, 240, 0.35);\n  --shadow-1: 0 1px 2px rgba(20, 23, 26, 0.08);\n  --shadow-2: 0 8px 24px -8px rgba(20, 23, 26, 0.14);\n  --shadow-card: 0 16px 48px -16px rgba(20, 23, 26, 0.2);\n  --grad-hero: radial-gradient(900px 480px at 12% -10%, rgba(142, 102, 255, 0.1), transparent 60%),\n               radial-gradient(1100px 560px at 88% -20%, rgba(169, 229, 20, 0.14), transparent 60%);\n}\n\n<\u002Fstyle>\n<link rel=\"icon\" href=\"d6acffde-6352-4efb-9037-fc7d268882e5\">\n<script src=\"4e84d270-fc17-4fae-8ab7-cccd5490ba25\"><\u002Fscript>\n<style>\n*{box-sizing:border-box}\nbody{margin:0;background:var(--ink-950);color:var(--text-mid);font-family:var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}\na{color:var(--link);text-decoration:none}a:hover{color:var(--link-hover)}\n.mono{font-family:var(--font-mono)}\n/* topbar */\n.top{display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid var(--border-1);background:rgba(11,13,19,.8);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}\n.brand{display:flex;align-items:center;gap:10px}\n.wm{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.04em;color:var(--text-hi)}\n.acct{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:999px;padding:7px 14px;font-family:var(--font-mono);font-size:12px;color:var(--text-hi);cursor:pointer;transition:border-color .15s}\n.acct:hover{border-color:var(--border-3)}\n.acct .dot{width:7px;height:7px;border-radius:99px;background:var(--profit-500);position:relative}\n.acct .dot::after{content:\"\";position:absolute;inset:-3px;border-radius:99px;border:1px solid var(--profit-500);opacity:.5;animation:ping 2s infinite}\n@keyframes ping{from{transform:scale(.6);opacity:.6}to{transform:scale(1.7);opacity:0}}\n.kpis{display:flex;gap:26px;margin-left:6px}\n.kpi .l{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text  ---------- */\nconst SYMS=[\n {sym:'EURUSD',name:'Euro / Dollar',px:1.0842,chg:0.12,dec:4,seed:11},\n {sym:'XAUUSD',name:'Gold',px:2412.30,chg:0.48,dec:2,seed:7},\n {sym:'BTCUSDT',name:'Bitcoin',px:118204,chg:-1.02,dec:0,seed:23},\n {sym:'GBPJPY',name:'Pound / Yen',px:204.118,chg:0.09,dec:3,seed:5},\n {sym:'US100',name:'Nasdaq 100',px:21884,chg:-0.31,dec:0,seed:17}];\nlet cur=SYMS[0],tf='15m';\nfunction rng(seed){let r=seed;return()=>(r=(r*16807)%2147483647)/2147483647}\nfunction candles(sym,tfName,n=64){\n const rnd=rng(sym.seed*7+tfName.length*13);let p=sym.px*0.985;const out=[];\n for(let i=0;i<n;i++){const o=p,c=o+(rnd()-.47)*sym.px*.004,h=Math.max(o,c)+rnd()*sym.px*.0018,l=Math.min(o,c)-rnd()*sym.px*.0018;p=c;out.push({o,h,l,c,v:.3+rnd()})}\n out[n-1].c=sym.px;return out}\nconst fmt=(v,d)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});\n/* ---------- watchlist ---------- */\nconst wl=document.getElementById('wl');\nfunction spark(seed,up){const rnd=rng(seed);let p=12,pts=[];for(let i=0;i<24;i++){p+=(rnd()-(up?.42:.58))*3;p=Math.max(2,Math.min(22,p));pts.push((i*4.2)+','+p)}return pts.join(' ')}\nfunction drawWL(){wl.innerHTML=SYMS.map(s=>{const up=s.chg>=0;return `<div class=\"wrow${s.sym===cur.sym?' on':''}\" data-s=\"${s.sym}\">\n <span class=\"wsym\">${s.sym}<span class=\"wnm\">${s.name}<\u002Fspan><\u002Fspan>\n <svg class=\"wspark\" viewBox=\"0 0 100 24\" preserveAspectRatio=\"none\"><polyline points=\"${spark(s.seed,up)}\" fill=\"none\" stroke=\"${up?'var(--profit-500)':'var(--loss-500)'}\" stroke-width=\"1.5\"/><\u002Fsvg>\n <span class=\"wpx\">${fmt(s.px,s.dec)}<span class=\"wchg\" style=\"color:${up?'var(--profit-400)':'var(--loss-400)'}\">${up?'▲':'▼'} ${Math.abs(s.chg).toFixed(2)}%<\u002Fspan><\u002Fspan><\u002Fdiv>`}).join('');\n wl.querySelectorAll('.wrow').forEach(r=>r.onclick=()=>{cur=SYMS.find(s=>s.sym===r.dataset.s);sync()})}\n/* ---------- chart ---------- */\nconst svg=document.getElementById('chart'),tip=document.getElementById('tip');\nlet C=[];\nfunction drawChart(){\n C=candles(cur,tf);\n const W=900,H=380,padR=64,padT=16,volH=44,plotH=H-volH-padT-12;\n const hi=Math.max(...C.map(c=>c.h)),lo=Math.min(...C.map(c=>c.l));\n const y=v=>padT+(hi-v)/(hi-lo)*plotH;\n const step=(W-padR)/C.length,bw=Math.max(2,step*.55);\n let out='';\n for(let i=0;i<5;i++){const g=lo+(hi-lo)*i/4;\n  out+=`<line x1=\"0\" x2=\"${W-padR}\" y1=\"${y(g)}\" y2=\"${y(g)}\" stroke=\"rgba(243,245,250,.05)\"/>`+\n       `<text x=\"${W-padR+8}\" y=\"${y(g)+3}\" fill=\"var(--text-low)\" font-size=\"10\" font-family=\"var(--font-mono)\">${fmt(g,cur.dec)}<\u002Ftext>`}\n C.forEach((c,i)=>{out+=`<rect x=\"${i*step+(step-bw)/2}\" y=\"${H-8-c.v*volH*.8}\" width=\"${bw}\" height=\"${c.v*volH*.8}\" fill=\"${c.c>=c.o?'var(--profit-500)':'var(--loss-500)'}\" opacity=\".22\" rx=\"1\"/>`});\n C.forEach((c,i)=>{const cx=i*step+step/2,col=c.c>=c.o?'var(--profit-500)':'var(--loss-500)';\n  out+=`<line x1=\"${cx}\" x2=\"${cx}\" y1=\"${y(c.h)}\" y2=\"${y(c.l)}\" stroke=\"${col}\"/>`+\n       `<rect x=\"${cx-bw/2}\" y=\"${y(Math.max(c.o,c.c))}\" width=\"${bw}\" height=\"${Math.max(1.5,Math.abs(y(c.o)-y(c.c)))}\" fill=\"${col}\" rx=\"1\"/>`});\n const last=C[C.length-1],lc=last.c>=last.o?'var(--profit-500)':'var(--loss-500)';\n out+=`<line x1=\"0\" x2=\"${W-padR}\" y1=\"${y(last.c)}\" y2=\"${y(last.c)}\" stroke=\"${lc}\" stroke-dasharray=\"3 3\" opacity=\".7\"/>`+\n      `<rect x=\"${W-padR+3}\" y=\"${y(last.c)-9}\" width=\"${padR-6}\" height=\"18\" rx=\"4\" fill=\"${lc}\"/>`+\n      `<text x=\"${W-padR/2}\" y=\"${y(last.c)+3}\" text-anchor=\"middle\" fill=\"#07080C\" font-size=\"10\" font-weight=\"700\" font-family=\"var(--font-mono)\">${fmt(last.c,cur.dec)}<\u002Ftext>`+\n      `<line id=\"xh\" y1=\"${padT}\" y2=\"${H-8}\" stroke=\"rgba(243,245,250,.25)\" stroke-dasharray=\"2 3\" visibility=\"hidden\"/>`;\n svg.innerHTML=out;\n svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;\n  const i=Math.min(C.length-1,Math.max(0,Math.floor(px/step))),c=C[i],xh=document.getElementById('xh');\n  xh.setAttribute('x1',i*step+step/2);xh.setAttribute('x2',i*step+step/2);xh.setAttribute('visibility','visible');\n  tip.style.display='block';\n  tip.innerHTML=`O <b>${fmt(c.o,cur.dec)}<\u002Fb>&nbsp; H <b>${fmt(c.h,cur.dec)}<\u002Fb>&nbsp; L <b>${fmt(c.l,cur.dec)}<\u002Fb>&nbsp; C <b style=\"color:${c.c>=c.o?'var(--profit-400)':'var(--loss-400)'}\">${fmt(c.c,cur.dec)}<\u002Fb>`};\n svg.onmouseleave=()=>{tip.style.display='none';const xh=document.getElementById('xh');xh&&xh.setAttribute('visibility','hidden')}}\n/* ---------- ticket ---------- */\nlet side='buy';const equity=12847;\nconst $=id=>document.getElementById(id);\nfunction calc(){\n const risk=parseFloat($('risk').value)||0,usd=equity*risk/100;\n const sl=parseFloat($('sl').value)||cur.px,tp=parseFloat($('tp').value)||cur.px;\n const dist=Math.abs(cur.px-sl)||cur.px*.001;\n const lots=Math.max(.01,usd/(dist*(cur.dec>=3?100000:100))).toFixed(2);\n $('riskusd').textContent=usd.toFixed(0);\n $('lots').textContent=lots+' lots';\n $('rr').textContent=(Math.abs(tp-cur.px)/dist).toFixed(1);\n $('maxloss').textContent='−$'+usd.toFixed(0);\n const buy=side==='buy';\n $('go').style.background=buy?'var(--profit-500)':'var(--loss-500)';\n $('go').style.color=buy?'#04150C':'#fff';\n $('go').textContent=(buy?'Buy ':'Sell ')+lots+' lots '+cur.sym}\n$('bBuy').onclick=()=>{side='buy';$('bBuy').classList.add('on');$('bSell').classList.remove('on');calc()};\n$('bSell').onclick=()=>{side='sell';$('bSell').classList.add('on');$('bBuy').classList.remove('on');calc()};\n['risk','sl','tp'].forEach(id=>$(id).addEventListener('input',calc));\ndocument.querySelectorAll('.otype').forEach(o=>o.onclick=()=>{document.querySelectorAll('.otype').forEach(x=>x.classList.remove('on'));o.classList.add('on')});\n$('go').onclick=()=>toast('Order sent','<b>'+$('go').textContent+'<\u002Fb> · guards checked ✓','profit');\ndocument.querySelectorAll('.sigbtn.yes').forEach(b=>b.onclick=()=>toast('Signal confirmed','<b>EURUSD Long 0.24<\u002Fb> queued for execution.','profit'));\ndocument.querySelectorAll('.sigbtn.no').forEach(b=>b.onclick=()=>toast('Signal skipped','Logged to journal — no order sent.','neutral'));\ndocument.querySelectorAll('.closex').forEach(b=>b.onclick=()=>toast('Position closed','Realized P&L added to journal.','profit'));\n/* ---------- tf + sync ---------- */\ndocument.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));b.classList.add('on');tf=b.textContent;drawChart()});\nfunction sync(){\n $('csym').textContent=cur.sym;$('tsym').textContent=cur.sym;\n $('cpx').textContent=fmt(cur.px,cur.dec);\n const up=cur.chg>=0;\n $('cpx').style.color=up?'var(--profit-400)':'var(--loss-400)';\n $('cchg').textContent=(up?'▲ +':'▼ −')+Math.abs(cur.chg).toFixed(2)+'%';\n $('cchg').style.cssText+=';background:'+(up?'var(--profit-tint)':'var(--loss-tint)')+';color:'+(up?'var(--profit-400)':'var(--loss-400)');\n document.querySelector('.askpx').textContent=fmt(cur.px,cur.dec);\n document.querySelector('.bidpx').textContent=fmt(cur.px*.9998,cur.dec);\n drawWL();drawChart();calc()}\n/* ---------- toasts ---------- */\nfunction toast(t,d,tone){const el=document.createElement('div');el.className='toast';\n if(tone==='profit'){el.style.borderLeftColor='var(--profit-500)';el.querySelector}\n el.innerHTML=`<span class=\"ic\" style=\"${tone==='profit'?'background:var(--profit-tint);color:var(--profit-400)':tone==='neutral'?'background:var(--surface-3);color:var(--text-mid)':''}\">${tone==='profit'?'✓':tone==='neutral'?'—':'!'}<\u002Fspan><div style=\"flex:1\"><div class=\"t\">${t}<\u002Fdiv><div class=\"d\">${d}<\u002Fdiv><\u002Fdiv><button class=\"x\">×<\u002Fbutton>`;\n if(tone==='profit')el.style.borderLeftColor='var(--profit-500)';\n if(tone==='neutral')el.style.borderLeftColor='var(--ink-600)';\n el.querySelector('.x').onclick=()=>el.remove();\n document.getElementById('toasts').appendChild(el);\n setTimeout(()=>{el.style.transition='all .4s';el.style.opacity='0';el.style.transform='translateX(30px)';setTimeout(()=>el.remove(),400)},5200)}\nsync();\nsetTimeout(()=>toast('Guard blocked an order','Size <b>2.4%<\u002Fb> exceeded your <b>1.0%<\u002Fb> max risk per trade.'),1800);\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
